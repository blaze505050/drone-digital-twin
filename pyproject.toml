[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "drone_sdk"
version = "2.0.0"
description = "High-fidelity closed-loop UAV Digital Twin platform with continuous state estimation, parallel physics twin, predictive maintenance, CFD surrogates, and multi-source telemetry."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "Aditya", email = "developer@uav-digital-twin.org" }
]
keywords = [
    "uav", "drone", "digital-twin", "robotics", "aerospace",
    "ekf", "physics-informed-neural-networks", "mavlink", "ros2", "px4"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Topic :: Scientific/Engineering :: Aviation",
    "Topic :: Scientific/Engineering :: Physics",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "numpy>=1.24.0",
    "scipy>=1.10.0",
]

[project.optional-dependencies]
test = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
]
lint = [
    "flake8>=6.0.0",
    "mypy>=1.0.0",
    "black>=23.0.0",
]
telemetry = [
    "h5py>=3.9.0",
    "pymavlink>=2.4.40",
    "mavsdk>=1.4.0",
    "aiohttp>=3.9.0",
]
ai = [
    "torch>=2.0.0",
    "gymnasium>=0.29.0",
    "stable-baselines3>=2.0.0",
]
all = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "flake8>=6.0.0",
    "mypy>=1.0.0",
    "black>=23.0.0",
    "h5py>=3.9.0",
    "pymavlink>=2.4.40",
    "aiohttp>=3.9.0",
    "matplotlib>=3.7.0",
]

[tool.setuptools]
package-dir = {"" = "sdk"}

[tool.setuptools.packages.find]
where = ["sdk"]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
pythonpath = ["sdk"]
addopts = "-ra -q"
filterwarnings = [
    "ignore::DeprecationWarning",
]
